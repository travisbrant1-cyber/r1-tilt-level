<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
    <title>Tilt Level</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app" data-mode="dark">
        <main>
            <div class="viz-area" id="vizArea">
                <div class="mode-flash" id="modeFlash"></div>
                <div class="viz viz-bubble active" id="vizBubble">
                    <div class="level-ring">
                        <div class="level-crosshair-h"></div>
                        <div class="level-crosshair-v"></div>
                        <div class="level-bubble" id="bubble"></div>
                    </div>
                </div>

                <div class="viz viz-crosshair" id="vizCrosshair">
                    <div class="grid-box">
                        <div class="grid-line grid-line-h"></div>
                        <div class="grid-line grid-line-v"></div>
                        <div class="grid-dot" id="gridDot"></div>
                    </div>
                </div>

                <div class="viz viz-gauge" id="vizGauge">
                    <div class="gauge-face">
                        <div class="gauge-tick gauge-tick-n"></div>
                        <div class="gauge-tick gauge-tick-e"></div>
                        <div class="gauge-tick gauge-tick-s"></div>
                        <div class="gauge-tick gauge-tick-w"></div>
                        <div class="gauge-needle" id="gaugeNeedle"></div>
                        <div class="gauge-center"></div>
                    </div>
                </div>

                <div class="viz viz-numeric" id="vizNumeric">
                    <div class="numeric-hero" id="numericHero">0.0&deg;</div>
                    <div class="numeric-sub" id="numericSub">X 0.00 &middot; Y 0.00</div>
                </div>
            </div>

            <div class="controls-row">
                <button id="modeToggle" class="toggle-btn" aria-label="Toggle light/dark mode">&#9789;</button>
                <button id="vibToggle" class="toggle-btn off" aria-label="Toggle vibration">VIB</button>
                <button id="soundToggle" class="toggle-btn" aria-label="Toggle sound">SND</button>
            </div>

            <div class="status-text" id="levelStatus"></div>

            <div class="readout">
                <div class="readout-row">
                    <span class="readout-label">Angle</span>
                    <span class="readout-value" id="angleValue">0.0&deg;</span>
                </div>
                <div class="readout-row">
                    <span class="readout-label">X</span>
                    <span class="readout-value" id="xValue">0.00</span>
                </div>
                <div class="readout-row">
                    <span class="readout-label">Y</span>
                    <span class="readout-value" id="yValue">0.00</span>
                </div>
            </div>

            <div class="hint" id="hint">Scroll/Tap: view &middot; Hold PTT: zero</div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
